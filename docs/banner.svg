<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Svaagat Travels">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062B5B"/>
      <stop offset="55%" stop-color="#0A3D74"/>
      <stop offset="100%" stop-color="#0E4C8F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6C445"/>
      <stop offset="100%" stop-color="#E7A81C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- subtle plane path -->
  <path d="M120 250 C 360 150, 840 150, 1080 60" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" stroke-dasharray="6 10" fill="none"/>
  <circle cx="1080" cy="60" r="5" fill="url(#gold)"/>

  <!-- title -->
  <text x="600" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#ffffff">Svaagat&#160;Travels</text>
  <rect x="500" y="150" width="200" height="4" rx="2" fill="url(#gold)"/>

  <!-- tagline -->
  <text x="600" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#DCE6F4">India&#8217;s warm welcome to the world</text>

  <!-- feature pills -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="322" y="232" width="130" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="387" y="260" text-anchor="middle" fill="#ffffff">Holidays</text>

    <rect x="466" y="232" width="118" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="525" y="260" text-anchor="middle" fill="#ffffff">Hotels</text>

    <rect x="598" y="232" width="122" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="659" y="260" text-anchor="middle" fill="#ffffff">Flights</text>

    <rect x="734" y="232" width="118" height="44" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="793" y="260" text-anchor="middle" fill="#ffffff">Forex</text>
  </g>
</svg>
